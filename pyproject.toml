[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "0.1.0"
description = "Watch a folder and organize files by category."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["watchdog>=4.0.0"]

[project.scripts]
file-organizer = "file_organizer.cli:main"

[tool.setuptools.package-data]
file_organizer = ["config.example.toml"]

[tool.setuptools.package-data]
file_organizer = ["config.toml"]